[project]
name = "acme-loan-mcp-server"
version = "0.1.0"
description = "Acme Financial Services MCP server — loan data tools backed by BigQuery"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.9.0",
  "google-cloud-bigquery>=3.25.0",
  "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
